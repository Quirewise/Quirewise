name: acceptance

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  ubuntu:
    name: ubuntu-24.04 / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [static, shared]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - name: Check out the application repository
        uses: actions/checkout@v4
        with:
          path: workspace/app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Check out the pinned library repositories
        working-directory: workspace/app
        env:
          QUIREWISE_REPOS_TOKEN: ${{ secrets.QUIREWISE_REPOS_TOKEN }}
        run: python tools/fetch_workspace.py --workspace ..

      - name: Build, test and audit
        working-directory: workspace
        run: |
          EXTRA=""
          if [ "$MODE" = "shared" ]; then EXTRA="--shared"; fi
          python app/tools/run_acceptance.py --workspace . $EXTRA \
            --jobs 4 --summary .tmp/acceptance/summary-$MODE.json

      - name: Upload acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-ubuntu-${{ matrix.mode }}
          path: |
            workspace/.tmp/acceptance/**/logs
            workspace/.tmp/acceptance/summary-*.json
          if-no-files-found: warn

  windows:
    name: windows-2022 / mingw / ${{ matrix.mode }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        mode: [static, shared]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - name: Check out the application repository
        uses: actions/checkout@v4
        with:
          path: workspace/app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MinGW64 GCC, CMake and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Check out the pinned library repositories
        working-directory: workspace/app
        shell: pwsh
        env:
          QUIREWISE_REPOS_TOKEN: ${{ secrets.QUIREWISE_REPOS_TOKEN }}
        run: |
          $env:Path = "C:\msys64\mingw64\bin;$env:Path"
          python tools/fetch_workspace.py --workspace ..

      - name: Build, test and audit
        working-directory: workspace
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;$env:Path"
          $extra = @()
          if ($env:MODE -eq "shared") { $extra += "--shared" }
          python app/tools/run_acceptance.py --workspace . @extra `
            --jobs 4 --summary ".tmp/acceptance/summary-$env:MODE.json"

      - name: Upload acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-windows-${{ matrix.mode }}
          path: |
            workspace/.tmp/acceptance/**/logs
            workspace/.tmp/acceptance/summary-*.json
          if-no-files-found: warn

  sanitizers:
    name: ubuntu-24.04 / asan+ubsan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the application repository
        uses: actions/checkout@v4
        with:
          path: workspace/app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Check out the pinned library repositories
        working-directory: workspace/app
        env:
          QUIREWISE_REPOS_TOKEN: ${{ secrets.QUIREWISE_REPOS_TOKEN }}
        run: python tools/fetch_workspace.py --workspace ..

      # The PDF engine lives in quirewise-document; rebuilding the dependency
      # chain without tests keeps this job short while still installing every
      # package the instrumented build consumes.
      - name: Build and install dependencies
        working-directory: workspace
        run: |
          python app/tools/run_acceptance.py --workspace . \
            --skip-tests --skip-consumer --skip-app --skip-gates

      - name: Build and test quirewise-document under ASan/UBSan
        working-directory: workspace
        run: |
          cmake -S libraries/quirewise-document -B .tmp/asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/.tmp/acceptance/static/install" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build .tmp/asan --parallel 4
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir .tmp/asan --output-on-failure

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-asan
          path: workspace/.tmp/asan/Testing/**
          if-no-files-found: warn
